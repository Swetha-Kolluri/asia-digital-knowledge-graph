function cardHTML(a,featured){

  const orgEl=isMDB?`<span class="card-org" style="color:#60a5fa">${esc(a.org)}</span>`:`<span class="card-org">${esc(a.country)}</span>`;
  const hl=esc(a.title||a.headline||"");
  return `<article class="${cl}" onclick="window.open('${esc(a.url)}','_blank')">

  <div class="card-body">

}

  } else {
    html=`<div class="grid">`;
    pool.forEach((a,i)=>{html+=cardHTML(a,i===0)});
    html+=`</div>`;
  }
  main.innerHTML=html;
}
function setTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
  document.getElementById("main").scrollIntoView({behavior:"smooth",block:"start"});
}
function setTheme(theme,btn){
  currentTheme=theme;
  document.querySelectorAll(".theme-pill").forEach(p=>p.classList.remove("active"));
  btn.classList.add("active");
  applyFilters();
}
function buildSources(){
  const el=document.getElementById("sources");
  const ct=SOURCES_COUNTRY.map(s=>`<span class="source-tag">${esc(s)}</span>`).join("");
  const mt=SOURCES_MDB.map(s=>`<span class="source-tag mdb">${esc(s)}</span>`).join("");
  el.innerHTML=`<h3>News Sources</h3><div class="sources-grid">${ct}${mt}</div><p class="footer-copy">Auto-updated daily via GitHub Actions &middot; Google News RSS &middot; ADB & World Bank news feeds &middot; Updated Jun 15, 2026 12:10 UTC</p>`;
}
document.getElementById("weekLabel").textContent="Week of Jun 15 – Jun 15, 2026";
document.getElementById("articleCount").textContent="56 articles this week";
buildTabs();applyFilters();buildSources();
</script>
